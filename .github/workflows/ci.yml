name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node scripts/patch-baileys-lid-retry.mjs
      - run: grep -q DIGAO_LID_PN_DECRYPT_RETRY_V2 node_modules/@whiskeysockets/baileys/lib/Utils/decode-wa-message.js
      - run: npm test
      - run: node --check src/index.js
      - run: node --check src/app.js
